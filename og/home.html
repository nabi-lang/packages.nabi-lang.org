<!doctype html>
<html lang="en" class="nb dk">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../web/css/nabi.css">
<style>
@font-face{font-family:"Geist";src:url("fonts/geist.woff2") format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Geist Mono";src:url("fonts/geist-mono.woff2") format("woff2");font-weight:500;font-display:block}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
.og{position:relative;width:1200px;height:630px;box-sizing:border-box;display:flex;flex-direction:column;padding:64px 72px;background:var(--bg)}
.top{display:flex;align-items:center;gap:24px;font-family:var(--mono);font-size:72px;line-height:72px;font-weight:500;letter-spacing:-0.03em;color:var(--ink-2)}
.top img{height:150px;width:auto;margin-left:-18px}
.top i{font-style:normal;color:var(--line-2)}
h1{margin:48px 0 0;font-family:var(--mono);font-size:64px;line-height:72px;letter-spacing:-0.04em;font-weight:600;color:var(--ink)}
.ft{position:relative;margin-top:auto;display:flex;align-items:center;gap:16px;font-family:var(--mono);font-size:22px;line-height:28px;color:var(--ink-3)}
</style>
</head>
<body>
<div class="og">
  <span class="top"><img src="../web/assets/brand/wordmark-dark.svg" alt=""><i>/</i>packages</span>
  <h1>The Nabi package registry</h1>
  <div class="ft"><span style="color:var(--acc)">$</span><span style="color:var(--ink)">nabi add json</span><span style="margin-left:auto">packages.nabi-lang.org</span></div>
</div>
</body>
</html>
